name: Enforce feature → develop only

on:
  pull_request:
    branches:
      - develop

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch is not main
        if: github.head_ref == 'main'
        run: |
          echo "❌ The main branch cannot be merged into develop"
          exit 1
